# CI — matriz de determinismo (SPEC-001 §14; gates G1 local-CI + G2 entre SO/backends)
name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-nativo,     cc: gcc,   cxx: g++,     portable: "OFF" }
          - { name: clang-nativo,   cc: clang, cxx: clang++, portable: "OFF" }
          - { name: gcc-portable,   cc: gcc,   cxx: g++,     portable: "ON" }
          - { name: clang-portable, cc: clang, cxx: clang++, portable: "ON" }
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de Python del compilador de datos
        # `data_compile` y `schemas` importan pyyaml, jsonschema y referencing.
        # Sin esto, ctest reporta los dos como ERROR de carga del modulo y la CI
        # queda roja — que es EXACTAMENTE lo que llevaba pasando desde el 25 de
        # julio sin que nadie mirara. El fallo no era del codigo: era que el
        # runner no tenia con que ejecutarlo.
        run: python3 -m pip install --upgrade pyyaml jsonschema referencing
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCHUNSA_WIDE128_FORCE_PORTABLE=${{ matrix.portable }}
      - name: Build
        run: cmake --build build -j
      - name: Golden vectors
        run: ./build/chunsa_sim_cli golden --vectors tests/determinism/golden
      - name: Unit props
        # EXCLUYE la etiqueta `perf`. Los bancos (bench_step,
        # bench_partida_larga) comparan tiempos de PARED contra referencias
        # medidas en la maquina de desarrollo. Un runner de GitHub es otra
        # maquina y otra carga: dejarlos aqui produciria fallos aleatorios, y
        # una prueba que falla sola se acaba ignorando — que es peor que no
        # tenerla. Se ejecutan a proposito, en local.
        run: ctest --test-dir build --output-on-failure -LE perf
      - name: G1 (dos corridas bit-exactas)
        run: ./build/chunsa_sim_cli run --selftest-g1

  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias de Python del compilador de datos
        # `data_compile` y `schemas` importan pyyaml, jsonschema y referencing.
        # Sin esto, ctest reporta los dos como ERROR de carga del modulo y la CI
        # queda roja — que es EXACTAMENTE lo que llevaba pasando desde el 25 de
        # julio sin que nadie mirara. El fallo no era del codigo: era que el
        # runner no tenia con que ejecutarlo.
        run: python3 -m pip install --upgrade pyyaml jsonschema referencing
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build (verifica intrinsics _mul128/_div128 — Anexo B.1)
        run: cmake --build build --config Release -j
      - name: Golden vectors
        run: ./build/Release/chunsa_sim_cli.exe golden --vectors tests/determinism/golden
      - name: Unit props
        run: ctest --test-dir build -C Release --output-on-failure -LE perf
