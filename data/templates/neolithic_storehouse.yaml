# Plantilla: almacén neolítico (épocas 2-3).
#
# Es el salto mecánico de la época 1 a la 2: el campamento paleolítico acopiaba
# grano SILVESTRE, este almacena la cosecha de domesticados. Por eso es el
# primero que pide ARCILLA (recurso de época 2, SPEC-007 §14) y el primero con
# armadura distinta de cero — hay algo dentro que merece la pena defender.
#
# Ventana [2,3] para que solape con los graneros de la época 3 y la transición
# no deje hueco; ese solape es además lo que da a Roma su segundo edificio en
# la época 3.
