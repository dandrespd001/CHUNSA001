# Plantilla: campamento de cazadores-recolectores (épocas 1-2).
#
# POR QUÉ EXISTE ESTA PLANTILLA Y NO DOS FICHEROS. En la época 1 (Paleolítica)
# no existen ni Egipto ni Roma: hay cazadores-recolectores en el valle del Nilo
# y cazadores-recolectores en la península itálica, con la misma economía de
# subsistencia. Darles mecánicas distintas sería inventar una diferencia que la
# arqueología no sostiene, así que la mecánica se escribe UNA vez.
#
# Lo que cada civilización aporta encima: su identificador, sus claves de
# localización, la tecnología que investiga, sus periodos jugables y —lo más
# importante— SU CITA. La procedencia nunca se hereda a ciegas: cada
# civilización responde de la suya.
#
# Medido antes de existir esto: los dos campamentos eran idénticos en 37 de 47
# líneas. Con dos civilizaciones eso es un fichero de más; con seis y quince
# épocas es el problema de contenido del proyecto.
