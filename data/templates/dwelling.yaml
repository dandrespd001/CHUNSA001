# Plantilla: vivienda. El edificio mas repetido de una partida.
#
# POR QUE ES BARATA Y POR QUE APORTA 5. Es la unica construccion que el jugador
# levanta DECENAS de veces, asi que su coste no es un numero de balance
# cualquiera: es el impuesto que se paga por crecer. 35 de madera y 5 de
# poblacion significa que llegar al tope duro de 200 cuesta 40 casas y 1400 de
# madera, una cifra que compite de verdad con el ejercito. Si fuera mas barata
# el tope dejaria de decidir nada; si fuera mas cara la partida se atascaria.
#
# No aparece en ninguna epoca concreta porque la vivienda no es una tecnologia:
# se vive bajo techo en las quince. Lo que cambia entre epocas es el aspecto,
# no la funcion, y eso es cosa de la presentacion, no del kernel.
