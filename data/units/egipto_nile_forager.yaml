    rationale: "Ataque 4 y daño de tipo PIERCE, no cut: el arma de la época 1 es la punta lítica montada —lanza, azagaya, flecha—, y perfora. Un filo de sílex corta, pero lo que mata a distancia de brazo en el Paleolítico es la punta. ARMADURA CERO EN LOS TRES TIPOS: nadie lleva protección en la época 1, y esa es justamente la lección de la fórmula de daño (SPEC-004 Parte VI) — con armadura 0 el daño recibido es el ataque íntegro, así que la época 1 es rápida y sangrienta, y toda armadura posterior se siente como una mejora real. Cuesta 10 de piedra además de comida porque su punta es piedra tallada. Velocidad 62 (más que el obrero, 55): caza. NO es un aldeano — no recolecta; el trabajo económico de la época 1 lo hace egipto:work_crew, cuya ventana se amplía a [1,5] en este mismo sprint."
