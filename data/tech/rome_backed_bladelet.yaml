    rationale: "Aqui las dos civilizaciones SI divergen, y es la primera vez en la partida. Egipto invierte su epoca 1 en la siega de grano silvestre (efecto economico, armadura del trabajador); Roma la invierte en el microlito de dorso rebajado, que es utillaje de CAZA, y el efecto es ataque +1 sobre infanteria. Misma epoca, mismo coste, dos apuestas distintas documentadas en dos culturas reales. Es la asimetria mas barata posible: no exige contenido nuevo, solo que cada civ gaste su epoca 1 en lo que de verdad hizo. El +1 sobre un ataque base de 4 es un 25 por ciento, que en una epoca sin armadura ninguna se nota de inmediato."
