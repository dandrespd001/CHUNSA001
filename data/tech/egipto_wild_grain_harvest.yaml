    rationale: "La primera tecnología del juego, y cuenta la idea más importante de la época 1: se siega grano que NADIE ha plantado. La fuente lo dice con una precisión que vale oro —«grains were not planted in ordered rows»— y ese es exactamente el límite que la época 2 romperá. El efecto es armor_cut +1 sobre citizen, un efecto DELIBERADAMENTE modesto: la piedra de moler y la hoz de sílice no hacen a nadie más fuerte, y prometer un salto económico aquí sería mentir sobre lo que fue esta tecnología. Lo que hace es que el trabajador aguante un poco más, que es lo que da una dieta más constante. Cuando exista el sistema de granjas (Sprint 1.12) esta tech será el contraste didáctico de la siembra."
    reviewed_by:
      - architect
