    rationale: "LA SENA DE IDENTIDAD DE CHINA, y no es un bono numerico: es una VENTAJA DE CALENDARIO. Nuestro catalogo situa el coque en la epoca 11 porque esa es la historia europea —Darby y Coalbrookdale, 1709—. La Song lo hizo en el siglo XI, que en nuestra escala es la epoca 7: unos SETECIENTOS anos antes. Por eso esta tech va en la epoca 7 y no en la 11, y por eso China es la unica que la tiene ahi. Y hay algo mejor que la fecha: la fuente dice que el cambio ahorro bosque —sparing thousands of acres of woodland from felling—, asi que engancha directamente con el sistema de madera renovable del Sprint 1.28. La tecnologia china resuelve el MISMO problema de deforestacion que el bosque plantado, por otra via. Eso es lo que hace que esta civilizacion no sea un reskin: no juega igual con otros nombres, llega antes y por otro camino. Mecanicamente da recovery +1000 puntos basicos, un 10 por ciento (el esquema acota el efecto a 1000 y se respeta en vez de ampliarlo por comodidad): de la misma roca sale mas metal util, que es lo que significa cambiar de combustible a uno que arde mas caliente y limpio."
