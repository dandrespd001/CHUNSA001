    rationale: "Es la tecnologia que hace verdad la correccion del Director: los yacimientos minerales no desaparecen, se vuelven inexplotables hasta que llega la tecnica. La flotacion por espuma hizo rentable justo el mineral de baja ley que la separacion gravitacional abandonaba, asi que un yacimiento agotado del siglo XIX es una mina rentable del XX. Concede la capacidad egipto:froth_flotation, que es la que abre la reserva de los depositos con reserve_capability. Epoca 12 porque la bibliografia del Bureau of Mines es de 1916 y nuestra epoca 12 llega hasta 1900 mientras la 13 empieza en ese ano: se coloca en la 12 como tecnologia de FINAL de epoca, que es cuando la tecnica se estaba gestando, y no en la 13, cuando ya era rutina. Coste alto y 1200 ticks: reabrir un mapa agotado debe costar una decision, no un tramite."
