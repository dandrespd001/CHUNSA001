  balance_design:
    author: architect
    rationale: "Tercera civilizacion, decision del Director. El identificador es china:yellow_river y no una dinastia a proposito: SPEC-TRAYECTORIA §1 define un linaje como TERRITORIO CON CONTINUIDAD, no como pueblo, y el valle del rio Amarillo es lo que une a Yangshao con la Republica Popular. China es ademas el mejor caso posible para esa definicion: pocos territorios tienen continuidad documentada tan larga. Su rasgo de juego no es un bono numerico sino una VENTAJA DE CALENDARIO: llego antes que Europa a varias tecnicas, y la mejor documentada es el paso del carbon vegetal al COQUE en el siglo XI —nuestra epoca 7— frente al XVIII europeo, unos setecientos anos. La fuente ademas dice que ese cambio ahorro bosque, asi que engancha con el sistema de madera renovable del Sprint 1.28: la tecnologia china resuelve el mismo problema de deforestacion por otra via."
    reviewed_by:
