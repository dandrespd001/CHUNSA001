# Hereda la mecanica de base:neolithic_storehouse. Aqui solo va lo que ES de esta
# civilizacion: identidad, periodos jugables y —sobre todo— su CITA.
# La procedencia nunca se hereda: cada civilizacion responde de la suya.
extends: base:neolithic_storehouse
id: rome:italic_storehouse
civ_id: rome:republic_imperial
display_name_key: rome:building.italic_storehouse
description_key: rome:building.italic_storehouse.description
playable_period_ids:
  - rome:italic_neolithic
  - rome:remedello_copper
provenance:
  historical_claims:
    evidence: H
    verification_reports:
      - game_data/research/verificacion/VERIF_EPOCAS_1_5.md
    sources:
      - citation: "Wikipedia, Remedello culture: la cultura se desarrolla «during the Copper Age (4th and 3rd millennium BCE)» en «Northern Italy, particularly in the area of the Po Valley», con enterramientos que contienen «arrows, stone daggers and polished stone axes»"
        locator: "Period and region — el hacha de piedra PULIDA (no tallada) es el marcador neolítico que sostiene la continuidad con la época 2"
        url: "https://en.wikipedia.org/wiki/Remedello_culture"
        accessed_on: "2026-07-31"
  balance_design:
    author: architect
    rationale: "De la Remedello calcolitica la fuente da fechas, region y ajuar; de un almacen NEOLITICO italico concreto no cita ninguna excavacion. Lo que sostiene la cita es el MARCO —hachas de piedra PULIDA, es decir neolitico, en continuidad hacia el Calcolitico del Po— y no el edificio en si. Se marca H porque el informe VERIF_EPOCAS_1_5 recoge y acota exactamente ese alcance; lo que no se afirma es que exista un almacen excavado con estas caracteristicas. Gemelo mecanico del egipcio:merimde_storage, con los mismos numeros y por la misma razon que los campamentos y los talleres: la asimetria de civilizacion empieza en la epoca 3, no antes. Su ventana [2,3] es la que da a Roma su SEGUNDO edificio en la epoca 3, que hasta el 1.22 no tenia ninguno."
    reviewed_by:
      - architect
