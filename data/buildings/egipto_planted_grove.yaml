    rationale: "Bosque plantado de egipto. Segunda mitad de la correccion del Director sobre la madera: los bosques del mapa ya se talaban y se consumian, faltaba poder PLANTAR. Usa el mismo mecanismo que la granja —deposito con regeneracion y edificio dueno— asi que la madera pasa a renovable sin inventar un segundo sistema. Regenera a la MITAD del ritmo de la granja, una unidad cada dos segundos, con techo mayor (200): un arbol tarda mas en crecer que el trigo y eso debe notarse. Cuesta 80 de madera, que es el bucle economico correcto —plantar arboles cuesta madera— e impide que salir del agujero sea gratis. Ventana [7,15] por SPEC-007 §16."
