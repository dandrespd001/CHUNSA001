    rationale: "Gemelo estructural del egipcio:qadan_camp, y a propósito. En la época 1 (Paleolítica) NO EXISTEN ni Egipto ni Roma: hay cazadores-recolectores en el valle del Nilo y cazadores-recolectores en la península itálica, con la misma economía de subsistencia. Aplicar aquí la asimetría de civilización sería inventar una diferencia que la arqueología no sostiene. Por eso los números son idénticos y lo que cambia es el nombre, la región y la tecnología que investiga (grano silvestre en el Nilo, hojita de dorso rebajado en Italia), que sí son rasgos documentados y distintos. Es el principio de SPEC-007 §22.2 —contenido compartido por defecto, diferenciado por excepción— aplicado donde más claro está."
