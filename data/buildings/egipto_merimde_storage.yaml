# Hereda la mecanica de base:neolithic_storehouse. Aqui solo va lo que ES de esta
# civilizacion: identidad, periodos jugables y —sobre todo— su CITA.
# La procedencia nunca se hereda: cada civilizacion responde de la suya.
extends: base:neolithic_storehouse
id: egipto:merimde_storage
civ_id: egipto:dynastic_nile
display_name_key: egipto:building.merimde_storage
description_key: egipto:building.merimde_storage.description
playable_period_ids:
  - egipto:fayum_neolithic
  - egipto:old_kingdom
provenance:
  historical_claims:
    evidence: H
    verification_reports:
      - game_data/research/verificacion/VERIF_EPOCAS_1_5.md
    sources:
      - citation: "Wikipedia, Faiyum A culture: la cultura de Faiyum A es «the earliest farming culture in the Nile Valley», fechada hacia 5600-4400 a.C., y en ella «Near Eastern domesticates were incorporated into a pre-existing foraging strategy»; el mismo artículo atribuye a MERIMDE, no a Faiyum A, unas «communal storage pits»"
        locator: "Faiyum Neolithic; la atribución del almacenamiento comunal es de Merimde — la fuente NO documenta silos ni cestería para Faiyum A"
        url: "https://en.wikipedia.org/wiki/Faiyum_A_culture"
        accessed_on: "2026-07-31"
  balance_design:
    author: architect
    rationale: "AVISO DE PROCEDENCIA, deliberado: este edificio se llama merimde_storage y NO fayum_silo porque la fuente atribuye las fosas de almacenamiento comunal a Merimde, mientras que de Faiyum A sólo sostiene que es la agricultura más antigua del valle del Nilo. Nombrarlo por el Fayum habría sido colgarle a un yacimiento una prueba que es de otro. Mecánicamente es el salto de la época 1 a la 2: el campamento qadan acopiaba grano SILVESTRE, este almacena la cosecha de domesticados de Oriente Próximo, y por eso es el primero que pide ARCILLA (recurso de época 2, SPEC-007 §14) y el primero con armadura distinta de cero — hay algo dentro que merece la pena defender. Ventana [2,3] para que solape con el granero dinástico y la transición no deje hueco."
    reviewed_by:
      - architect
