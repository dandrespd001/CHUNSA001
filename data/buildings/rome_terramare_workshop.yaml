    sources:
      - citation: "Wikipedia, Terramare culture: fechada «c. 1700–1150 BC» en el Bronce Medio y Final, «mainly of the central Po Valley, in Emilia, Northern Italy»; sus gentes eran «fairly skilful metallurgists, casting bronze in moulds of stone and clay», produciendo «axes, daggers, swords, razors, and knives»; cultivaban «beans, grapes, wheat, and flax»"
