  balance_design:
    author: architect
    rationale: "Las dos recetas salen LITERALMENTE de la misma frase de la fuente, no de un diseño de escritorio. La fundición de bronce en moldes «of stone and clay» es la razón de que el edificio cueste piedra Y arcilla, y de que acepte cobre y estaño como acopio. El enlutado del lino sale de «beans, grapes, wheat, and flax»: la Terramare es la primera prueba citada que tenemos de lino cultivado en Italia, y engancha los textiles del 1.9C con la época 4 en vez de dejarlos flotando. La proporción cobre 3 : estaño 1 se copia de rome:bronze_smelting a propósito —es la misma aleación, no puede dar otra cosa— pero tarda 260 ticks frente a 240: el molde bipartito de piedra es más lento que la fundición clásica, y esa es la mejora que la época 5 aporta. HP 500 y armadura de impacto 1 recogen el terraplén con contrafuertes y el foso que describe la fuente. Cierra el hueco de Roma en la época 4."
    reviewed_by:
      - architect
