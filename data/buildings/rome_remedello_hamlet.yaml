    rationale: "Aquí EMPIEZA la asimetría, y por eso este edificio no tiene gemelo egipcio. La época 3 de CHUNSA es la Calcolítica del cobre nativo (SPEC-007 §3) y la Remedello es exactamente eso en Italia: 3400–2400 a.C., valle del Po, objetos de cobre y plata arsenical junto a dagas y hachas todavía de piedra. Ese solapamiento —cobre y piedra en la misma tumba— es la lección de la época 3 y por eso el edificio acepta COBRE como punto de acopio pero sigue costando piedra. Antes del 1.22 Roma no tenía absolutamente nada en las épocas 3 y 4: empezaba en la 5 y las dos anteriores eran inalcanzables. Entrena obreros para que la Calcolítica no dependa del centro."
