    rationale: "El segundo edificio de la época 1, y no es relleno: ADVANCE_EPOCH exige DOS edificios completos cuya ventana incluya la época actual, así que sin él la civilización quedaría atrapada en la Paleolítica para siempre. Cuesta piedra además de madera porque su materia prima ES la piedra — es el primer edificio del juego que pide un mineral, y enseña la idea de que fabricar consume material. Entrena al recolector-cazador (única unidad militar de la época). HP 200: más frágil que el campamento, porque es un taller a cielo abierto, no un recinto."
