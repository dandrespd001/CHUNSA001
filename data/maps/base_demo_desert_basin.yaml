  # =============================================================================
  # CHUNSA — ZONAS BOSCOSAS (recurso estructurado, radio variable)
  # =============================================================================
  # 4 entradas propias (2 por jugador, espejadas) + 2 entradas neutrales
  # disputadas en el corredor central. Total añadido: 6 entradas.
  # Calibración REF_BOSQUES_RTS.md (manchas AoE2):
  #   - 1 árbol = 100 madera; patch típico 15-25 árboles → 1500-2500
  #   - 1 tile = 1000 millitiles; patch típico 4-8 tiles de radio
  #   - R_media_carga = R0 * sqrt(0.5) ≈ 0.707 * R0 (no se evapora)
  #   - Aldeano tala a radio_actual + 1 tile del centro (en el BORDE)
  # Madera ya existente: 1000 wood puntual por base.
# CORRECCION del Arquitecto sobre el bloque original: decia "12 dep totales en
# mapa" y son 22 los previos, 28 con estos seis. El delegado lo detecto y lo
# dejo tal cual porque se le ordeno no retocar el bloque, que fue lo correcto:
# avisar en vez de corregir en silencio un dato ajeno. Se corrige aqui, donde
# se puede razonar. Siguen muy por debajo de ECO_MAX_DEPOSITS=64, y las granjas
# ocupan slots ademas de estos (seis por jugador en el banco).
  # =============================================================================

  # --- BOSQUES PROPIOS: STARTER (1 por jugador, espejados) ---
  # 15 árboles, 1500 madera, ~15 tiles de la base. No está pegado a la base
  # (eso sería madera gratis en la puerta) pero sí al alcance del primer
  # aldeano. Posición NE para P0 / NW para P1: el wood de 1000 que ya tiene
  # cada base está al SW/SE, así cada jugador tiene bosques en dos flancos.
  # Radio 4 tiles ≈ patch de AoE2 de 15 árboles. El aldeano se planta a 5
  # tiles del centro para talar.
  - kind: resource
    id: chunsa:wood
    x_millitiles: 38000
    y_millitiles: 118000
    amount: 1500
    radius_millitiles: 4000
  - kind: resource
    id: chunsa:wood
    x_millitiles: 218000
    y_millitiles: 118000
    amount: 1500
    radius_millitiles: 4000

  # --- BOSQUES PROPIOS: PRINCIPAL (1 por jugador, espejados) ---
  # 25 árboles, 2500 madera, ~31 tiles de la base. Hay que expandir un poco
  # para llegar — NO es wood del primer minuto, pero sigue siendo madera
  # SEGURA (no hay que cruzar el muro). Radio 6 tiles: a media carga aún
  # conserva 4.2 tiles, suficiente para mantener cobertura de chopping a
  # mitad del parche. Posición SE para P0 / SW para P1, completando la
  # distribución de flancos sin solaparse con el starter.
  - kind: resource
    id: chunsa:wood
    x_millitiles: 55000
    y_millitiles: 145000
    amount: 2500
    radius_millitiles: 6000
  - kind: resource
    id: chunsa:wood
    x_millitiles: 201000
    y_millitiles: 145000
    amount: 2500
    radius_millitiles: 6000

  # --- BOSQUES NEUTRALES: CORREDOR CENTRAL (disputados, espejados) ---
  # 30 árboles por parche, 3000 madera — los bosques más grandes del mapa.
  # Asentados a 18 tiles del eje del muro (x=128000), exactamente sobre
  # y=128000 (centro del hueco, que va de y=124000 a y=132000). El jugador
  # del lado oeste controla el parche oeste sin cruzar el muro; el del lado
  # este, el parche este. Para DENEGAR el parche rival hay que cruzar el
  # gap — ese es el incentivo del "disputado": quien controle el muro se
  # lleva el wood extra Y bloquea el del rival. Radio 7 tiles: el aldeano
  # se planta a 8 tiles del centro, más cerca del muro que del borde.
  - kind: resource
    id: chunsa:wood
    x_millitiles: 110000
    y_millitiles: 128000
    amount: 3000
    radius_millitiles: 7000
  - kind: resource
    id: chunsa:wood
    x_millitiles: 146000
    y_millitiles: 128000
    amount: 3000
    radius_millitiles: 7000
