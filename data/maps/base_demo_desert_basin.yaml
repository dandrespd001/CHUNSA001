  # Sprint 1.8D — contenido, depósitos y costes reales (SPEC-007 §9.2, SPEC-004
  # §15.1). 22 depósitos (≤ ECO_MAX_DEPOSITS=64): 8 base espejados (4 pares
  # food/food/wood/stone, "x_der = 256000 - x_izq", misma Y, mismo amount,
  # mismo id) + 4 neutros IMPAR sobre el eje central x=128000, y∈[124000,
  # 132000) (hueco del muro, gs_init_cost_grid). Cubre 7 de los 9 recursos
  # de las épocas 1-4 (falta plomo y estaño por el límite de 12). Cantidades
  # subidas para que la apertura de la época 3-4 no agote la zona propia:
  # base food 500→1500, base wood 500→1000, base stone 500→800. Los neutros
  # disputados son ahora los 4 metales de la Calcolítica + sal.
  # --- Slot 0 (centro en 20500, 128500) — base food×2 + wood + stone, radio 8–20 tiles ---
