  # veces (estaño, mena de hierro, caliza) y que hoy caza el guardián de
  # obtenibilidad de test_craft.
  #
  # AVISO HONESTO SOBRE LA LANA: un «depósito» de lana es una abstracción. La
  # lana sale de un rebaño, no de un yacimiento, y el modelo de ganado no
  # existe hasta el Sprint 1.12. Se deja como depósito finito —un rebaño
  # salvaje que se agota— y se sustituirá cuando haya ganado de verdad. Queda
  # dicho aquí para que nadie lo lea como una decisión de diseño meditada.
